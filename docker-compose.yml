  auth-service:
    build:
      context: ./auth-service
    container_name: codereview-auth
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=your_jwt_secret_here
      - PORT=5000
    # depends_on:
    #   db:
    #     condition: service_healthy
    # Uncomment to enable hot-reloading for local dev
    # volumes:
    #   - ./auth-service:/app
    #   - /app/node_modules

  ai-service:
    build:
      context: ./ai-service
    container_name: codereview-ai
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      # NOTE: Replace with your actual Gemini API key or set it in a .env file next to docker-compose.yml
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    # depends_on:
    #   db:
    #     condition: service_healthy
    # Uncomment to enable hot-reloading for local dev
    # volumes:
    #   - ./ai-service:/app

  frontend:
    build:
      context: ./frontend
    container_name: codereview-frontend
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - ai-service

volumes:
  pgdata:
